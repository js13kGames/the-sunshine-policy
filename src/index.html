<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>The Last Rainbow</title>
<style>
* { box-sizing: border-box; }
html { background: #171b2b; color: #fff5de; }
body { margin: 0; font: 600 16px/1.45 system-ui, sans-serif; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [role=button]:focus-visible { outline: 2px solid #f9d886; outline-offset: 4px; }
#frame { position: absolute; width: min(100vw, 160vh); width: min(100vw, 160svh); aspect-ratio: 8/5; inset: 0; margin: auto; overflow: hidden; background: #303749; }
#stage { display: block; width: 100%; height: 100%; touch-action: none; }
#stage [role=button] { cursor: pointer; outline: none; }
.hit { fill: transparent; }
#hud { position: absolute; left: 3%; right: 3%; top: 3%; display: flex; align-items: start; justify-content: space-between; pointer-events: none; }
#location { font-size: clamp(10px, 1.2vw, 15px); letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 1px 5px #000; }
#inventory { display: flex; gap: 5px; pointer-events: auto; }
#inventory button { width: clamp(30px, 4.7vw, 56px); height: clamp(30px, 4.7vw, 56px); border: 1px solid #fff3; border-radius: 3px; background: #191b2bbc; padding: 4px; }
#inventory button:hover { background: #454359; border-color: #ffe3a0; }
#inventory svg { width: 100%; height: 100%; }
#bubble { position: absolute; z-index: 3; max-width: min(440px, 88%); padding: .8em 1em; background: #fff5de; color: #282737; border-radius: 5px; box-shadow: 0 4px 0 #151a2933; font-size: clamp(12px, 1.65vw, 21px); font-weight: 550; }
#bubble:after { content: ''; position: absolute; left: var(--tail, 50%); bottom: -10px; border: 6px solid transparent; border-top: 6px solid #fff5de; }
#speaker { display: block; font-size: .64em; text-transform: uppercase; letter-spacing: .14em; margin-bottom: .4em; color: #806343; font-weight: 800; }
#next { display: block; margin-top: .5em; text-align: right; font-size: .58em; letter-spacing: .1em; opacity: .65; }
#choices { display: grid; gap: .2em; }
#choices button { border: 0; padding: .35em 0; background: none; text-align: left; color: #32324a; }
#choices button:hover { color: #9a4d42; text-decoration: underline; }
#footer { position: absolute; bottom: 0; width: 100%; min-height: 7%; padding: .7% 3%; background: #161a2acc; display: flex; align-items: center; gap: 1em; }
#info { flex: 1; font-size: clamp(10px, 1.3vw, 17px); }
#footer button { background: none; border: 0; padding: 3px; font-size: clamp(10px, 1.1vw, 14px); opacity: .8; }
#cover, #menu { position: absolute; inset: 0; z-index: 4; padding: 8% 7%; background: linear-gradient(90deg, #191c2bc9, #191c2b00 85%); }
.eyebrow { font-size: clamp(9px, 1.2vw, 15px); letter-spacing: .23em; text-transform: uppercase; color: #eac992; }
h1 { font: 500 clamp(32px, 7.3vw, 100px)/.96 Georgia, serif; letter-spacing: -.045em; margin: 5% 0 3%; }
#cover p { max-width: 27em; width: 52%; font-size: clamp(10px, 1.5vw, 20px); font-weight: 400; color: #e7ddd1; }
.primary { display: inline-block; background: #f1d398; color: #282737; border: 0; border-radius: 2px; padding: .65em 1.2em; margin: 1em .5em 0 0; font-size: clamp(11px, 1.5vw, 19px); }
.secondary { background: #202538dd; border: 1px solid #d6bd8870; color: #f9e8cb; }
#cover .footnote { position: absolute; bottom: 5%; font-size: clamp(9px, 1.1vw, 14px); letter-spacing: .06em; opacity: .65; }
#menu { background: #191c2bee; text-align: center; padding: 10% 8%; font-size: clamp(12px, 1.6vw, 20px); overflow: auto; }
#menu h2 { font: 500 2.4em Georgia, serif; margin: 0 0 .6em; }
#menu p { max-width: 35em; margin: 1em auto; }
[hidden] { display: none !important; }
.drift { animation: drift 10s linear infinite alternate; }
.turn { transform-box: fill-box; transform-origin: center; animation: turn 14s linear infinite; }
.flow { animation: flow 1.8s linear infinite; }
.rain { animation: rain .7s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
@keyframes drift { to { transform: translateX(12px); } }
@keyframes flow { to { stroke-dashoffset: -12; } }
@keyframes rain { to { transform: translate(-2px, 6px); } }
@media (prefers-reduced-motion: reduce) { *, *:after { animation: none !important; } }
@media (max-aspect-ratio: 4/5) {
	#frame { width: 100vw; overflow: visible; }
	#bubble { font-size: 15px; max-width: 94%; }
	#inventory button { width: 35px; height: 35px; }
	#footer { min-height: 35px; transform: translateY(100%); }
	#menu { inset: -20vh 0; padding-top: 20%; }
}
</style>
